baseURL: https://ianchen28.github.io/
title: "Ian Chen | AI Research"
theme: PaperMod

enableInlineShortcodes: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 15
summaryLength: 140

minify:
  disableXML: true

permalinks:
  post: "/:title/"

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# --- Multilingual ---
languages:
  en:
    languageName: "English"
    weight: 1
    title: "Ian Chen | AI Research"
    params:
      description: "LLM Agent evaluation, rubric quality, and reward modeling research by Ian Chen."
    menu:
      main:
        - identifier: home
          name: Home
          url: /
          weight: 1
        - identifier: research
          name: Research
          url: /#research
          weight: 2
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 3
        - identifier: posts
          name: Writing
          url: /posts/
          weight: 4
        - identifier: about
          name: About
          url: /about/
          weight: 5
        - identifier: search
          name: Search
          url: /search/
          weight: 6
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 15
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 20

  zh:
    languageName: "中文"
    weight: 2
    title: "Ian Chen | AI 研究"
    params:
      description: "LLM Agent 评估、Rubric 质量与奖励建模研究 — Ian Chen"
    menu:
      main:
        - identifier: home
          name: 首页
          url: /
          weight: 1
        - identifier: research
          name: 研究
          url: /#research
          weight: 2
        - identifier: projects
          name: 项目
          url: /projects/
          weight: 3
        - identifier: posts
          name: 写作
          url: /posts/
          weight: 4
        - identifier: about
          name: 关于
          url: /about/
          weight: 5
        - identifier: search
          name: 搜索
          url: /search/
          weight: 6
        - identifier: tags
          name: 标签
          url: /tags/
          weight: 15
        - identifier: archives
          name: 归档
          url: /archives/
          weight: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  author: Ian Chen

  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideFooter: false
  ShowWordCounts: true
  ShowLastMod: true

  ShowToc: true
  TocOpen: true

  comments: true

  socialIcons:
    - name: github
      url: "https://github.com/ianchen28"
    - name: RSS
      url: "index.xml"

  label:
    text: "Ian Chen"
    icon: "img/avatar.jpg"
    iconHeight: 35

  assets:
    favicon: "img/avatar.jpg"
    favicon16x16: "img/avatar.jpg"
    favicon32x32: "img/avatar.jpg"
    apple_touch_icon: "img/avatar.jpg"
    safari_pinned_tab: "img/avatar.jpg"
    disableFingerprinting: true

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary"]

  StartYear: 2020

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    noClasses: true
    tabWidth: 4
    style: monokai

privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
