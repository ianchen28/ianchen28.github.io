baseURL: https://ianchen28.github.io/
title: "Ian's Blog"
theme: PaperMod

enableInlineShortcodes: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 15
summaryLength: 140

minify:
  disableXML: true

permalinks:
  post: "/:title/"

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# --- Multilingual ---
languages:
  en:
    languageName: "English"
    weight: 1
    title: "Ian's Blog"
    params:
      description: "LLM Agent evaluation, rubric quality, and reward modeling research by Ian Chen."
      profileMode:
        enabled: true
        title: "Hi, I'm Ian"
        subtitle: "Principal Applied Scientist @ Microsoft<br/>LLM Agent Evaluation & Rubric Quality Research"
        imageUrl: "img/avatar.jpg"
        imageWidth: 150
        imageHeight: 150
        buttons:
          - name: Research
            url: posts/research
          - name: Tech
            url: posts/tech
          - name: Archive
            url: posts/archive
    menu:
      main:
        - identifier: search
          name: Search
          url: /search/
          weight: 1
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 3
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 15
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 50

  zh:
    languageName: "中文"
    weight: 2
    title: "Ian 的博客"
    params:
      description: "LLM Agent 评估、Rubric 质量与奖励建模研究 — Ian Chen"
      profileMode:
        enabled: true
        title: "你好，我是 Ian"
        subtitle: "微软首席应用科学家<br/>LLM Agent 评估 & Rubric Quality 研究"
        imageUrl: "img/avatar.jpg"
        imageWidth: 150
        imageHeight: 150
        buttons:
          - name: 研究
            url: posts/research
          - name: 技术
            url: posts/tech
          - name: 归档
            url: posts/archive
    menu:
      main:
        - identifier: search
          name: 搜索
          url: /search/
          weight: 1
        - identifier: posts
          name: 文章
          url: /posts/
          weight: 3
        - identifier: tags
          name: 标签
          url: /tags/
          weight: 15
        - identifier: archives
          name: 归档
          url: /archives/
          weight: 20
        - identifier: about
          name: 关于
          url: /about/
          weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  author: Ian Chen

  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideFooter: false
  ShowWordCounts: true
  ShowLastMod: true

  ShowToc: true
  TocOpen: true

  comments: true

  socialIcons:
    - name: github
      url: "https://github.com/ianchen28"
    - name: email
      url: "mailto:ianchen28@gmail.com"
    - name: RSS
      url: "index.xml"

  label:
    text: "Ian's Blog"
    icon: "img/avatar.jpg"
    iconHeight: 35

  assets:
    favicon: "img/avatar.jpg"
    favicon16x16: "img/avatar.jpg"
    favicon32x32: "img/avatar.jpg"
    apple_touch_icon: "img/avatar.jpg"
    safari_pinned_tab: "img/avatar.jpg"
    disableFingerprinting: true

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary"]

  StartYear: 2020

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    noClasses: true
    tabWidth: 4
    style: monokai

privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
